  # --- count: numbers from count_by, with denominators --------------------------
  - id: count-impact-areas
    question: "How many CDE publications are there in each impact area?"
    kind: count
    expect:
      tools: [count_by]
      numbers: [2002, 1275, 741, 559]
    notes: >
      `chatcde count impact_area`: SL 2,002, SG 1,275, TE 741, JE 559 of 3,003 records
      (a record can be in several areas; 249 untagged).

  - id: count-sg-interviews
    question: "How many Sustainable Governance publications use interviews or focus groups?"
    kind: count
    expect:
      tools: [count_by]
      numbers: [165, 1275]
    notes: >
      Filtered by impact area. `chatcde count method --tag impact_area:SG --level term`:
      MET-interviews-and-focus-groups 165 of 1,275 SG records (201 without a method tag).

  - id: count-sl-countries
    question: "In which countries has CDE done the most research on sustainable land systems?"
    kind: count
    expect:
      tools: [count_by]
      mentions: ["Switzerland", "Kenya", "Bolivia"]
      numbers: [336, 150]
    notes: >
      Filtered by impact area. `chatcde count country --tag impact_area:SL`: of 2,002 SL
      records, global or multi-country 492, CHE 336, KEN 150, BOL 146, ETH 135, LAO 112,
      MDG 110 (233 without a country tag).

  - id: count-je-sdgs
    question: "Which SDGs do CDE's Just Economies and Human Well-being publications address most often?"
    kind: count
    expect:
      tools: [count_by]
      numbers: [184, 180, 173]
    notes: >
      Filtered by impact area. `chatcde count sdg --tag impact_area:JE`: of 559 JE
      records, SDG 15 184, SDG 13 180, SDG 1 173, SDG 10 145 (102 without an SDG tag).

  - id: count-te-policy-audience
    question: "Of CDE's Transformative Education and Science publications, how many are written for a policy audience?"
    kind: count
    expect:
      tools: [count_by]
      numbers: [233]
    notes: >
      Filtered by impact area. `chatcde count audience_type --tag impact_area:TE`:
      Policy 233 of 741 TE records (Academic 533, Practitioner 217, Public 20; 118
      untagged). 233 of 623 (the TE records with an audience tag, from
      `count impact_area audience_type`) is also right when it says so, so only 233
      is required (changed after the baseline of 2026-11-15).

  - id: count-laos
    question: "How many CDE publications are about Laos?"
    kind: count
    expect:
      numbers: [142]
    notes: >
      `chatcde count country`: LAO 142 of 3,003 (country tags; 585 records have none).
      Title search alone finds fewer (35 titles say "Laos"). No tool is required:
      list_vocabulary's record counts give the same 142 (baseline, 2026-11-15).

  - id: count-since-2020
    question: "How many publications has CDE produced since 2020, and in which impact area most?"
    kind: count
    expect:
      tools: [count_by]
      numbers: [1058, 627]
    notes: >
      `chatcde count impact_area --year-from 2020`: 1,058 records; SL 627, SG 494, TE 289,
      JE 259 (77 untagged).

  - id: count-full-text
    question: "For how many CDE publications can ChatCDE read the full text?"
    kind: count
    expect:
      tools: [coverage_report]
      numbers: [1542, 3003]
    notes: >
      `chatcde coverage`: 1,542 full text, 606 abstract only, 855 metadata only, of 3,003.

  # --- gaps: observed vs expected from find_gaps ----------------------------------
  - id: gaps-sg-methods
    question: "Which methods has CDE rarely used in Sustainable Governance?"
    kind: gaps
    expect:
      tools: [find_gaps]
      mentions_any: ["geospatial", "biophysical"]
    notes: >
      Issue #67 (decision 0037). Seen on 2026-11-11 answered with the smallest group
      share (14%), which is not rare. Known answer (2026-11-11, tag.v5, vocab 0.4,
      2,331 records without conference items): find_gaps(impact_area, method) has no
      SG cell at ratio <= 0.25, at group or term level. Within SG,
      find_gaps(sub_area, method) flags SG-b x MET-G-geospatial-and-land (2 records,
      14.3 expected) and SG-a x MET-G-biophysical (7, 32.8 expected). Recompute with
      `chatcde gaps --dims impact_area,method` and `--dims sub_area,method`.
      Rechecked 2026-11-15 after #70: 2 vs 14.2 and 7 vs 32.7.

  - id: gaps-te-data-types
    question: "Which kinds of data has CDE rarely used in its Transformative Education and Science work?"
    kind: gaps
    expect:
      tools: [find_gaps]
      mentions_any: ["geospatial", "remote sensing"]
      numbers: [21]
    notes: >
      `chatcde count impact_area data_type --gaps`: the only cell is TE x
      DAT-G-geospatial-and-remote-sensing, 21 records where 90.9 were expected. At
      sub-area level TE-a x geospatial is 0 vs 12.7 (`count sub_area data_type --gaps`).

  - id: gaps-te-sdgs
    question: "Which SDGs does CDE's Transformative Education and Science work rarely address, compared with the rest of CDE?"
    kind: gaps
    expect:
      tools: [find_gaps]
      mentions_any: ["SDG 8", "Goal 8", "decent work", "economic growth"]
    notes: >
      `chatcde count impact_area sdg --gaps --level term`: TE x SDG 8, 2 records where
      21.5 were expected; the other cell is SG x SDG 4 (14 vs 57.0).

  - id: gaps-je-regions
    question: "Which world regions has CDE rarely studied in its Just Economies research?"
    kind: gaps
    expect:
      tools: [find_gaps]
      mentions_any: ["Eastern Africa", "East Africa"]
    notes: >
      Like gaps-sg-methods, the answer is one level down. `chatcde count impact_area
      region --gaps --level term` flags no JE cell. `chatcde count region sub_area --gaps
      --level term`: Eastern Africa (and CDE-EAF) x JE-d 0 vs 5.4 and x JE-c 1 vs 9.4.
      A good answer says there is no gap at impact-area level and names these cells.

