# Test questions with known answers (#19), format: docs/decisions/0025-evaluate-questions.md.
# Expected values come from the real catalogue; `notes` says how to recompute them
# when the data or the tags change. Run with `chatcde evaluate questions`.
#
# Written on 2026-11-15 by the only developer (decision 0033), not by CDE researchers:
# the questions are what a researcher might plausibly ask, checked against the data,
# and should be reviewed by CDE staff in a later phase.
# Data state: 3,003 records, tag.v5, vocabulary 0.4, tools.min_confidence 0.5
# (decision 0038). Counts with `chatcde count` include all publication types; gaps
# (`--gaps`, `chatcde gaps`) leave conference items out (decision 0018).
# Record lists in `records_any` are the records whose title is plainly on the topic
# (DuckDB title queries); citing any one of them passes.
version: 1
questions:
  # --- lookup: one known publication -------------------------------------------
  - id: lookup-kenya-atlas
    question: "Who wrote CDE's Socio-Economic Atlas of Kenya, and when was the revised edition published?"
    kind: lookup
    expect:
      records_all: [553b8aad-5cdf-4652-b0b8-e38cf774d03a]
      mentions: ["Wiesmann", "Kiteme"]
      numbers: [2016]
    notes: >
      `chatcde show 553b8aad-5cdf-4652-b0b8-e38cf774d03a`: book, 2016, authors
      Wiesmann, Kiteme, Mwangi.

  - id: lookup-lao-atlas
    question: "Which period does the Socio-Economic Atlas of the Lao PDR cover?"
    kind: lookup
    expect:
      records_all: [48f57ad3-89d8-4459-9770-b73990409502]
      numbers: [2005, 2015]
    notes: >
      Title "Socio-Economic Atlas of the Lao PDR. Patterns and trends from 2005 to 2015"
      (2018, Epprecht et al.). The older "Atlas of agriculture in the Lao PDR"
      (9ce79cef-…, 1999–2011) is a different record and does not answer the question.

  - id: lookup-land-concessions-laos
    question: "Who are the authors of 'Governing Land Concessions in Laos', and in which book did it appear?"
    kind: lookup
    expect:
      records_all: [49690ed2-b4bd-4bb6-afbf-d8b6bda7c87d]
      mentions: ["Kenney-Lazar", "Messerli"]
      mentions_any: ["Routledge Handbook", "Land and Resource Grabbing"]
    notes: >
      `chatcde show 49690ed2-b4bd-4bb6-afbf-d8b6bda7c87d`: 2023 book section in the
      Routledge Handbook of Global Land and Resource Grabbing; authors Kenney-Lazar,
      Schönweger, Messerli, Nanhthavong.

  - id: lookup-econ-wocat
    question: "Is there a CDE dataset on the costs and benefits of sustainable land management technologies? What is it called?"
    kind: lookup
    expect:
      records_any: [38e0f041-afbd-47ec-bd1f-9a2e097656ac]
      mentions: ["ECON-WOCAT"]
    notes: >
      2022 policy brief "Costs and Benefits of Sustainable Land Management
      Technologies - a new open access ECON-WOCAT dataset …" (Mirzabaev et al.).

  # --- search: the answer is in the body text, not in a reference list (#68) -----
  - id: search-glacier-tien-shan
    question: "How much glacier area was lost in the Northern Tien Shan, according to CDE research?"
    kind: search
    expect:
      tools: [search_publications]
      records_any: [1c085052-ef78-475b-b4ca-d8577cf7ca95]
      numbers: [28]
    notes: >
      Niederer et al. 2008, "Tracing glacier wastage in the Northern Tien Shan": 28% area
      loss in the Sokoluk watershed, 1963–2000 (abstract and page 1); small glaciers lost
      41.5% between 1986 and 2000. Search "glacier retreat in Central Asia" puts this
      record first.

  - id: search-slm-costs
    question: "What are typical establishment costs of sustainable land management technologies in the WOCAT data?"
    kind: search
    expect:
      tools: [search_publications]
      records_any: [12fb6992-829a-4501-b08d-0c457ebc6701, 38e0f041-afbd-47ec-bd1f-9a2e097656ac]
      numbers: [470]
    notes: >
      12fb6992-… (2013, global WOCAT data), page 3: "The median establishment cost for the
      363 SLM case studies is US $ 470" (per hectare). Search "costs and benefits of
      sustainable land management technologies" finds both records.

  - id: search-mount-kenya-food-security
    question: "What keeps food-insecure smallholder households around north-west Mount Kenya from using their land productively?"
    kind: search
    expect:
      tools: [search_publications]
      records_any: [42033b6e-4aec-4a31-85a6-71c25c89188f, e854a702-4935-4114-80fa-7aa717334d2f, 46c001fe-fb53-498c-9a74-726b6f0143b2]
      mentions_any: ["technology", "tools", "implements"]
    notes: >
      42033b6e-… (2020, Theory of Access, 76 households): food insecurity was not mainly a
      lack of property rights but of access to farm technology (hand tools and
      implements). Its pages 12–14 are references; the finding is in the abstract
      and page 1.

  - id: search-coffee-cocoa-governance
    question: "Which sustainability governance strategies do companies use in coffee and cocoa value chains besides certification?"
    kind: search
    expect:
      tools: [search_publications]
      records_any: [c5fb904c-048c-4565-a843-231eb34a5a66]
      mentions_any: ["direct trade", "mission-driven", "solidarity economy", "producer-led"]
    notes: >
      c5fb904c-… (2026): six strategies (corporate programmes, certification, direct
      trade, mission-driven businesses, solidarity economy, producer-led upgrading),
      survey of 112 organisations in Switzerland and Peru. The first search hits for
      "sustainable coffee value chains" are its reference pages 15–16.

