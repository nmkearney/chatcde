justice_lens:
  terms:
  - code: JUS-decolonial
    label: Decolonial
    definition: Colonial legacies and North-South hierarchies in knowledge, economies or governance.
    source: seed
  - code: JUS-distributive
    label: Distributive
    definition: Who gets the benefits, burdens, resources and risks (income, land, environmental harm).
    source: seed
  - code: JUS-gender
    label: Gender
    definition: Inequalities, roles and relations between women, men and gender minorities.
    source: seed
  - code: JUS-none-explicit
    label: None explicit
    definition: Filled in by code when the abstract or full text addresses none of the lenses; never offered
      to the model (tagging.none_terms).
    source: seed
    note: 'Pilot review 2026-11-09: the model gave it with weak evidence (#1, #14), which says nothing'
  - code: JUS-power
    label: Power
    definition: 'Power relations and asymmetries among actors that shape outcomes: elite capture, corporate
      influence, unequal bargaining.'
    includes:
    - Power dynamics
    - power asymmetries
    source: seed
    note: 'Pilot review 2026-11-09 #1: should have been tagged'
  - code: JUS-procedural
    label: Procedural
    definition: 'Who takes part in decisions and how fairly: participation, consultation, consent, transparency,
      accountability.'
    source: seed
    note: 'Pilot review 2026-11-09: missed on #12, #14 (and #4 unsure)'
  - code: JUS-recognition
    label: Recognition
    definition: Respect for the identities, knowledge and status of groups, e.g. indigenous peoples or
      marginalised groups.
    source: seed

