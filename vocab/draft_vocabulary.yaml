    source: candidate
  - code: ACT-companies-and-investors
    label: Companies and investors
    group: ACT-G-private-sector
    definition: Private sector entities including corporations, businesses, and firms, excluding public
      sector bodies and non-profit organizations.
    includes:
    - business people
    - businesses
    - companies
    - corporate companies
    - corporates
    - corporations
    - large companies
    - private companies
    source: seed
  - code: ACT-financial-sector
    label: Financial sector
    group: ACT-G-private-sector
    definition: Banks, investment funds, insurers and other financial institutions, including development
