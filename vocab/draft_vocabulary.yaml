    source: seed
  - code: ACT-swiss-companies
    label: Swiss companies
    group: ACT-G-private-sector
    definition: Private enterprises and business entities operating within Switzerland, including specific
      sectors or national business groups.
    source: candidate
  - code: ACT-consumers
    label: Consumers
    group: ACT-G-public-and-households
