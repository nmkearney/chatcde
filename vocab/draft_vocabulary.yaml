    includes:
    - farmers
    - smallholder farmers
    - small-scale farmers
    - local farmers
    - small farmers
    - swidden farmers
    - farming households
    - peasants
    - rural households
    - rural people
    - rural residents
    - small private farmers
    source: seed
  - code: ACT-villagers-and-village-communities
    label: Villagers and village communities
    group: ACT-G-land-users-and-communities
    definition: Residents of rural settlements and their collective social units, distinct from broader
      local community or indigenous groupings.
    source: candidate
  - code: ACT-water-users-and-managers
    label: Water users and managers
    group: ACT-G-land-users-and-communities
    definition: Individuals, associations, or authorities involved in the use, management, or governance
      of water resources at local, regional, or basin levels.
    source: candidate
  - code: ACT-agribusinesses
    label: Agribusinesses
    group: ACT-G-private-sector
    definition: Large-scale commercial agricultural enterprises and agro-industrial corporations involved
