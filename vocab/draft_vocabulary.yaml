    includes:
    - governments
    - government agencies
    - government ministries
    - national governments
    - government
    - government institutions
    - government ministry
    - authorities
    - enforcement authorities
    - public authorities
    - african governments
    - Horn of Africa countries
    source: seed
    note: 'Pilot review 2026-11-09 #7: split from municipal; code kept (no corpus tags yet)'
  - code: ACT-national-environmental-agencies
    label: National environmental agencies
    group: ACT-G-state-and-international
    definition: Government departments or offices specifically responsible for environmental policy, regulation,
      and protection at the national level.
    source: candidate
  - code: ACT-nature-park-management
    label: Nature park management
    group: ACT-G-state-and-international
    definition: Organisations, staff, and managers responsible for the administration and operation of
      nature parks and biosphere reserves.
    source: candidate
  - code: ACT-policy-makers
    label: Policy makers
    group: ACT-G-state-and-international
    definition: Individuals or bodies with authority to formulate, adopt, or implement public policies,
      including national and local government officials.
    source: candidate
  - code: ACT-regional-and-state-authorities
    label: Regional and state authorities
    group: ACT-G-state-and-international
    definition: Government bodies and administrative institutions operating at the sub-national, regional,
